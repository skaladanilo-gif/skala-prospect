:root { --font-sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --font-mono: "Space Mono", ui-monospace, Menlo, monospace; }
/* =====================================================================
   Skala Prospect — sistema visual
   Marca Skala+: fundo preto dominante, verde-limão como acento pontual,
   DM Sans (títulos e corpo) + Space Mono (dados técnicos: CNPJ, telefone).
   ===================================================================== */

:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface-2: #1a1a1a;
  --line: #262626;
  --line-strong: #333333;
  --text: #ededed;
  --muted: #8a8a8a;
  --lime: #c6f833;
  --lime-ink: #0a0a0a;
  --red: #e5484d;
  --amber: #f2b035;

  --st-novo: #8a8a8a;
  --st-qualificado: #f2b035;
  --st-prospeccao: #6ec1ff;
  --st-negociacao: #b794f6;
  --st-convertido: #c6f833;
  --st-descartado: #e5484d;

  --r-sm: 8px;
  --r-md: 12px;
  --gutter: clamp(16px, 4vw, 40px);
  --header-h: 64px;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);

  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans), system-ui, sans-serif;
  font-size: 15px;
  font-weight: 450;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
::selection { background: var(--lime); color: var(--lime-ink); }

:focus-visible {
  outline: 2px solid var(--lime);
  outline-offset: 2px;
  border-radius: 4px;
}

.mono { font-family: var(--font-mono), ui-monospace, monospace; font-size: 0.87em; letter-spacing: 0; }
.muted { color: var(--muted); }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------------------------------------------------------------- header */
.topo {
  position: sticky; top: 0; z-index: 20;
  height: var(--header-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--gutter);
  background: rgb(10 10 10 / 0.86);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.marca { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
.marca-logo { display: block; height: 24px; width: auto; color: var(--text); }
.marca-produto {
  color: var(--muted); font-family: var(--font-mono), ui-monospace, monospace;
  font-size: 11px; font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase;
  padding-left: 12px; border-left: 1px solid var(--line-strong); line-height: 18px;
}

.nav { display: flex; gap: 4px; }
.nav a {
  display: inline-flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 14px; border-radius: 999px;
  text-decoration: none; color: var(--muted); font-weight: 600;
  transition: color .15s, background .15s;
}
.nav a:hover { color: var(--text); }
.nav a[aria-current="page"] { color: var(--text); background: var(--surface-2); }
.nav .contador {
  min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px;
  background: var(--lime); color: var(--lime-ink);
  font-size: 12px; font-weight: 700; display: inline-grid; place-items: center;
}

.pagina { padding: 0 var(--gutter) 120px; max-width: 1320px; margin: 0 auto; }

/* --------------------------------------------------------- frase de busca */
.frase {
  margin: clamp(32px, 6vh, 64px) 0 24px;
  font-size: clamp(36px, 5.6vw, 72px);
  font-weight: 800;
  line-height: 1.02;
  letter-spacing: -0.045em;
  max-width: 24ch;
  text-wrap: balance;
}
.frase .liga { color: var(--muted); font-weight: 700; }
.token {
  font-weight: 800; letter-spacing: inherit; line-height: inherit;
  text-align: left;
  text-decoration-line: underline;
  text-decoration-color: var(--lime);
  text-decoration-thickness: 0.07em;
  text-underline-offset: 0.1em;
  text-decoration-skip-ink: auto;
  transition: color .15s;
  border-radius: 2px;
}
.token:hover, .token[data-state="open"] { color: var(--lime); }
.token.vazio { color: var(--muted); }
.token.vazio:hover, .token.vazio[data-state="open"] { color: var(--lime); }

/* ------------------------------------------------- filtros principais */
.principais { display: grid; grid-template-columns: repeat(2, minmax(0, 340px)); gap: 10px; margin-bottom: 12px; }
.campo-filtro {
  display: flex; align-items: center; gap: 14px; min-width: 0;
  height: 68px; padding: 0 18px; border-radius: var(--r-md);
  background: var(--surface); border: 1px solid var(--line-strong); text-align: left;
  transition: border-color .15s, background .15s;
}
.campo-filtro:hover { border-color: var(--muted); }
.campo-filtro[data-state="open"] { border-color: var(--text); background: var(--surface-2); }
.campo-filtro.ativo { border-color: var(--lime); }
.campo-icone { width: 20px; height: 20px; color: var(--muted); flex: none; }
.campo-filtro.ativo .campo-icone { color: var(--lime); }
.campo-texto { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.campo-rotulo { font-size: 12px; color: var(--muted); font-weight: 500; }
.campo-valor { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.campo-seta { width: 18px; height: 18px; color: var(--muted); flex: none; }

/* ------------------------------------------------------------------ chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 16px; border-radius: 999px;
  border: 1px solid var(--line-strong); color: var(--text);
  font-weight: 600; white-space: nowrap;
  transition: border-color .15s, background .15s, color .15s;
}
.chip:hover { border-color: var(--muted); }
.chip[data-state="open"] { border-color: var(--text); }
.chip.ativo { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip .selo {
  min-width: 20px; height: 20px; border-radius: 999px; padding: 0 6px;
  background: var(--lime); color: var(--lime-ink); font-size: 12px; font-weight: 700;
  display: inline-grid; place-items: center;
}
.chip svg { width: 16px; height: 16px; flex: none; }
.chip-limpar { color: var(--muted); font-weight: 600; padding: 0 8px; height: 40px; }
.chip-limpar:hover { color: var(--text); }

/* --------------------------------------------------------------- popover */
.pop {
  z-index: 50;
  min-width: 260px; max-width: min(420px, calc(100vw - 32px));
  max-height: min(480px, var(--radix-popover-content-available-height, 480px));
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  padding: 8px;
  box-shadow: 0 24px 60px rgb(0 0 0 / 0.6);
  transform-origin: var(--radix-popover-content-transform-origin);
  animation: surge .16s var(--ease);
}
.pop.largo { width: 420px; }
@keyframes surge { from { opacity: 0; transform: scale(.97) translateY(-4px); } }

.pop-busca {
  display: flex; align-items: center; gap: 10px;
  height: 44px; padding: 0 12px; margin-bottom: 6px;
  background: var(--surface-2); border-radius: var(--r-sm);
}
.pop-busca svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.pop-busca input { flex: 1; min-width: 0; background: none; border: 0; outline: none; height: 100%; }
.pop-busca input::placeholder { color: var(--muted); }

.opcoes { list-style: none; margin: 0; padding: 0; }
.opcao {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  min-height: 44px; padding: 8px 12px; border-radius: var(--r-sm);
  text-align: left; font-weight: 550;
}
.opcao:hover, .opcao[data-ativo="true"] { background: var(--surface-2); }
.opcao[aria-selected="true"] { color: var(--lime); }
.opcao .qtd { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.opcao .sub { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }
.opcoes-titulo { color: var(--muted); font-size: 13px; padding: 12px 12px 4px; }
.opcao .com-marca { display: inline-flex; align-items: center; gap: 12px; }
.opcao[aria-selected="true"] .com-marca { color: var(--text); }
.visto { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line-strong); flex: none; display: grid; place-items: center; }
.visto[data-on="true"] { background: var(--lime); border-color: var(--lime); }
.visto[data-on="true"]::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--lime-ink); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.pop-rodape { position: sticky; bottom: -8px; margin: 6px -8px -8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.opcoes-vazio { color: var(--muted); padding: 14px 12px; font-size: 14px; }

.grupo-campo { padding: 10px 8px 14px; border-bottom: 1px solid var(--line); }
.grupo-campo:last-of-type { border-bottom: 0; }
.grupo-campo > .rotulo { font-size: 13px; color: var(--muted); margin-bottom: 10px; display: block; }
.alternativas { display: flex; flex-wrap: wrap; gap: 6px; }
.alternativa {
  height: 36px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line-strong); font-weight: 600; font-size: 14px;
}
.alternativa:hover { border-color: var(--muted); }
.alternativa[aria-pressed="true"] { background: var(--lime); color: var(--lime-ink); border-color: var(--lime); }
.campo {
  width: 100%; height: 44px; padding: 0 12px; border-radius: var(--r-sm);
  background: var(--surface-2); border: 1px solid var(--line); outline: none;
}
.campo:focus { border-color: var(--muted); }
.campo::placeholder { color: var(--muted); }

.interruptor { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; cursor: pointer; }
.interruptor input { appearance: none; width: 40px; height: 24px; border-radius: 999px; background: var(--line-strong); position: relative; cursor: pointer; transition: background .15s; flex: none; }
.interruptor input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--text); transition: transform .2s var(--ease); }
.interruptor input:checked { background: var(--lime); }
.interruptor input:checked::after { transform: translateX(16px); background: var(--lime-ink); }

/* ------------------------------------------------------------- botões */
.botao {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px; border-radius: 999px; font-weight: 700; white-space: nowrap;
  text-decoration: none;
  transition: background .15s, color .15s, border-color .15s, opacity .15s;
}
.botao svg { width: 18px; height: 18px; flex: none; }
.botao.primario { background: var(--lime); color: var(--lime-ink); }
.botao.primario:hover { background: #d4ff52; }
.botao.secundario { border: 1px solid var(--line-strong); }
.botao.secundario:hover { border-color: var(--muted); }
.botao.fantasma { color: var(--muted); }
.botao.fantasma:hover { color: var(--text); }
.botao.escuro { background: var(--lime-ink); color: var(--lime); }
.botao:disabled { opacity: .45; cursor: not-allowed; }
.botao.grande { height: 48px; padding: 0 22px; font-size: 16px; }

/* ------------------------------------------------- barra de resultados */
.barra {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  margin: 48px 0 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line);
}
.total { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.total span { color: var(--muted); font-weight: 600; font-size: 17px; letter-spacing: -0.01em; margin-left: 6px; }
.barra-acoes { display: flex; align-items: center; gap: 4px; }

/* -------------------------------------------------------------- tabela */
.lista { list-style: none; margin: 0; padding: 0; }
.linha {
  display: grid;
  grid-template-columns: 36px minmax(0, 2.6fr) minmax(0, 1.2fr) 88px 110px 64px 140px;
  align-items: center; gap: 16px;
  min-height: 68px; padding: 10px 12px 10px 8px;
  border-bottom: 1px solid var(--line);
  position: relative;
  transition: background .12s;
}
.lista.sem-marcar .linha { grid-template-columns: minmax(0, 2.6fr) minmax(0, 1.2fr) 88px 110px 64px 140px; padding-left: 12px; }
.lista.sem-marcar .linha > .vaga { display: none; }
.linha.cabecalho { min-height: 40px; color: var(--muted); font-size: 13px; font-weight: 500; border-bottom-color: var(--line); }
.linha:not(.cabecalho):hover { background: var(--surface); }
.linha.selecionada { background: rgb(198 248 51 / 0.05); }
.linha.selecionada::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--lime); }
.linha-abrir { position: absolute; inset: 0; z-index: 0; }
.linha > *:not(.linha-abrir) { position: relative; z-index: 1; pointer-events: none; }
.linha > .marcar, .linha > .marcar * { pointer-events: auto; }

.nome { min-width: 0; }
.nome strong { display: block; font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -0.01em; }
.nome small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.celula { color: var(--text); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.celula.muted { color: var(--muted); }
.contatos { display: flex; gap: 8px; color: var(--muted); }
.contatos svg { width: 16px; height: 16px; }
.contatos .tem { color: var(--text); }
.contatos .nao { opacity: .25; }

.marcar { display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--r-sm); cursor: pointer; }
.marcar input {
  appearance: none; width: 18px; height: 18px; border-radius: 5px; margin: 0;
  border: 1.5px solid var(--line-strong); display: grid; place-items: center; cursor: pointer;
  transition: background .12s, border-color .12s;
}
.marcar input:hover { border-color: var(--muted); }
.marcar input:checked { background: var(--lime); border-color: var(--lime); }
.marcar input:checked::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--lime-ink); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.marcar input:indeterminate { background: var(--lime); border-color: var(--lime); }
.marcar input:indeterminate::after { content: ""; width: 8px; height: 2px; background: var(--lime-ink); }

.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.porte { font-size: 13px; font-weight: 600; color: var(--muted); }
.porte.mei { color: var(--amber); }

.mais { display: flex; justify-content: center; padding: 28px 0; }

/* --------------------------------------------------------- estados */
.vazio-bloco { padding: 72px 0; max-width: 520px; }
.vazio-bloco h2 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 8px; }
.vazio-bloco p { color: var(--muted); margin: 0 0 20px; }
.erro-bloco { border-left: 3px solid var(--red); padding: 16px 20px; background: var(--surface); border-radius: 0 var(--r-sm) var(--r-sm) 0; margin: 24px 0; }

.esqueleto { height: 14px; border-radius: 6px; background: var(--surface-2); position: relative; overflow: hidden; }
.esqueleto::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.04), transparent); animation: brilho 1.4s infinite; }
@keyframes brilho { to { transform: translateX(100%); } }
.carregando { opacity: .55; transition: opacity .2s; }
.girar { animation: girar 0.9s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }

/* --------------------------------------------- barra de seleção em massa */
.massa {
  position: fixed; left: 50%; bottom: 24px; z-index: 30;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 16px;
  padding: 8px 8px 8px 20px; border-radius: 999px;
  background: var(--lime); color: var(--lime-ink);
  box-shadow: 0 20px 50px rgb(0 0 0 / 0.55);
  font-weight: 700;
  animation: subir .22s var(--ease);
  max-width: calc(100vw - 32px);
}
.massa .botao.fantasma { color: var(--lime-ink); opacity: .7; }
.massa .botao.fantasma:hover { opacity: 1; }
@keyframes subir { from { opacity: 0; transform: translate(-50%, 16px); } }

/* ---------------------------------------------------------------- gaveta */
.veu { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / 0.55); animation: aparecer .2s; }
@keyframes aparecer { from { opacity: 0; } }
.gaveta {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 41;
  width: min(520px, 100vw);
  background: var(--surface);
  border-left: 1px solid var(--line);
  display: flex; flex-direction: column;
  animation: deslizar .26s var(--ease);
  outline: none;
}
@keyframes deslizar { from { transform: translateX(40px); opacity: 0; } }
.gaveta-topo { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 0 28px; }
.gaveta-corpo { flex: 1; overflow: auto; padding: 8px 28px 32px; }
.fechar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.fechar:hover { color: var(--text); background: var(--surface-2); }
.fechar svg { width: 20px; height: 20px; }

.ficha-nome { font-size: 32px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.08; margin: 4px 0 8px; text-wrap: balance; }
.ficha-id { display: flex; align-items: center; gap: 8px; color: var(--muted); flex-wrap: wrap; }
.copiar { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 6px; color: var(--muted); font-size: 13px; }
.copiar:hover { background: var(--surface-2); color: var(--text); }
.copiar svg { width: 14px; height: 14px; }

.acoes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 24px 0 28px; }
.acao {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  height: 72px; border-radius: var(--r-md);
  background: var(--surface-2); color: var(--text);
  font-size: 13px; font-weight: 600; text-decoration: none;
  transition: background .15s, color .15s;
}
.acao:hover { background: var(--line); }
.acao svg { width: 20px; height: 20px; }
.acao.principal { background: var(--lime); color: var(--lime-ink); }
.acao.principal:hover { background: #d4ff52; }
.acao[aria-disabled="true"] { opacity: .35; pointer-events: none; }

.secao { margin-top: 28px; }
.secao h3 { font-size: 13px; color: var(--muted); font-weight: 500; margin: 0 0 12px; }

.etapas { display: flex; flex-wrap: wrap; gap: 6px; }
.etapa {
  display: inline-flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line-strong); font-size: 14px; font-weight: 600;
}
.etapa i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.etapa:hover { border-color: var(--muted); }
.etapa[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.etapa[aria-pressed="true"] i { background: var(--etapa-cor); }

.socios { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.socio { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.socio:last-child { border-bottom: 0; }
.socio-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; color: var(--muted); }
.socio-avatar svg { width: 18px; height: 18px; }
.socio-info { min-width: 0; display: grid; gap: 2px; }
.socio-info strong { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.socio-info small { color: var(--muted); font-size: 13px; }
.socio-acoes { display: flex; flex-wrap: wrap; gap: 2px; margin: 4px 0 0 -8px; }
.socio-acoes .copiar { text-decoration: none; }
.dados { display: grid; grid-template-columns: 120px 1fr; gap: 12px 16px; margin: 0; }
.dados dt { color: var(--muted); font-size: 14px; }
.dados dd { margin: 0; font-size: 15px; overflow-wrap: anywhere; }

.notas {
  width: 100%; min-height: 110px; resize: vertical;
  padding: 12px 14px; border-radius: var(--r-md);
  background: var(--surface-2); border: 1px solid var(--line); outline: none; line-height: 1.5;
}
.notas:focus { border-color: var(--muted); }
.notas::placeholder { color: var(--muted); }
.salvo { font-size: 12px; color: var(--muted); height: 18px; margin-top: 6px; }

.rodape-ficha { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.perigo { color: var(--muted); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; height: 36px; }
.perigo:hover { color: var(--red); }
.perigo svg { width: 16px; height: 16px; }
.confirmar { background: var(--surface-2); border-radius: var(--r-md); padding: 16px; margin-top: 16px; }
.confirmar p { margin: 0 0 12px; font-size: 14px; }
.confirmar .botao.perigoso { background: var(--red); color: #fff; }

/* ---------------------------------------------------------------- aviso */
.avisos { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; pointer-events: none; }
.aviso {
  background: var(--text); color: var(--bg); font-weight: 600;
  padding: 12px 18px; border-radius: 999px; box-shadow: 0 16px 40px rgb(0 0 0 / 0.5);
  animation: subir2 .22s var(--ease); display: flex; align-items: center; gap: 10px; white-space: nowrap;
}
.aviso svg { width: 18px; height: 18px; color: #2b7a0b; }
.aviso.erro svg { color: var(--red); }
@keyframes subir2 { from { opacity: 0; transform: translateY(12px); } }

/* -------------------------------------------------------------- leads */
.abas { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; }
.aba {
  display: inline-flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 16px; border-radius: 999px;
  border: 1px solid var(--line-strong); font-weight: 600;
}
.aba i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.aba .qtd { color: var(--muted); font-variant-numeric: tabular-nums; }
.aba:hover { border-color: var(--muted); }
.aba[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.aba[aria-pressed="true"] .qtd { color: #555; }
.aba[aria-pressed="true"] i { background: var(--aba-cor); }

/* ------------------------------------------------------------- entrar */
.entrar {
  min-height: 100dvh; display: grid; place-items: center; padding: 24px;
  background: radial-gradient(60vmax 40vmax at 50% 0%, rgb(198 248 51 / 0.07), transparent 70%), var(--bg);
}
.entrar form { width: min(360px, 100%); }
.entrar .marca-logo { height: 52px; margin-bottom: 14px; }
.entrar .marca-produto { display: block; width: max-content; padding-left: 0; border-left: 0; margin-bottom: 40px; }
.entrar .campo { height: 52px; font-size: 16px; margin-bottom: 12px; }
.entrar .botao { width: 100%; }
.entrar .erro { color: var(--red); font-size: 14px; min-height: 22px; margin: 4px 0 8px; }

.base-info { color: var(--muted); font-size: 13px; margin-top: 18px; }

/* ----------------------------------------------------------- responsivo */
@media (max-width: 1080px) {
  .linha { grid-template-columns: 36px minmax(0, 2.4fr) minmax(0, 1fr) 80px 96px 128px; }
  .lista.sem-marcar .linha { grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr) 80px 96px 128px; }
  .col-contato { display: none !important; }
}
@media (max-width: 820px) {
  .linha { grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; min-height: 72px; }
  .lista.sem-marcar .linha { grid-template-columns: minmax(0, 1fr) auto; }
  .linha .col-bairro, .linha .col-tempo, .linha .col-porte, .linha .col-contato { display: none !important; }
  .linha.cabecalho { display: none; }
  .nome small.meta-movel { display: block; }
  .chips { flex-wrap: nowrap; overflow-x: auto; margin: 0 calc(var(--gutter) * -1); padding: 2px var(--gutter); scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .marca-produto { display: none; }
  .principais { grid-template-columns: 1fr; }
  .gaveta { width: 100vw; border-left: 0; }
  .acoes { grid-template-columns: repeat(2, 1fr); }
  .dados { grid-template-columns: 1fr; gap: 2px; }
  .dados dd { margin-bottom: 12px; }
  .massa { bottom: 16px; gap: 8px; padding-left: 16px; }
  .avisos { bottom: 88px; }
}
@media (min-width: 821px) { .nome small.meta-movel { display: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* Boneco da Skala: editor e miniaturas. Usa os tokens de app/globals.css. */

.av-editor {
  display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px; align-items: start;
  color: var(--text); font-family: var(--font-sans, "DM Sans"), system-ui, sans-serif;
}

/* ---- prévia */
/* --av-topo: altura de qualquer barra fixa acima do editor (o pai define; padrão 0). */
.av-palco { position: sticky; top: calc(var(--av-topo, 0px) + 16px); display: grid; gap: 12px; justify-items: center; }
.av-previa {
  width: 100%; aspect-ratio: 1; border-radius: 28px; overflow: hidden;
  border: 1px solid var(--line); background: var(--surface);
  box-shadow: 0 24px 60px rgb(0 0 0 / 0.45);
}
.av-previa-svg { display: block; width: 100%; height: 100%; }
.av-aleatorio {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px;
  border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface-2);
  color: var(--text); font: inherit; font-weight: 600; cursor: pointer; transition: border-color .15s, color .15s;
}
.av-aleatorio:hover { border-color: var(--lime); color: var(--lime); }
.av-aleatorio:focus-visible, .av-aba:focus-visible, .av-opcao:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

/* ---- abas */
.av-painel { min-width: 0; display: grid; gap: 16px; }
.av-abas {
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  padding-bottom: 2px; -webkit-mask-image: linear-gradient(90deg, #000 92%, transparent);
  mask-image: linear-gradient(90deg, #000 92%, transparent);
}
.av-abas::-webkit-scrollbar { display: none; }
.av-aba {
  flex: none; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: color .15s, background .15s, border-color .15s;
}
.av-aba:hover { color: var(--text); }
.av-aba[aria-selected="true"] { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }

.av-cabecalho {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  font-weight: 700; font-size: 18px; letter-spacing: -0.01em;
}
.av-contagem, .av-conquistas h3, .av-trava span {
  font-family: var(--font-mono, "Space Mono"), ui-monospace, monospace; font-weight: 400;
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}

/* ---- grade de opções */
.av-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.av-grade-cores { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
.av-opcao {
  position: relative; display: grid; justify-items: center; align-content: start; gap: 8px;
  padding: 10px 6px 10px; border-radius: var(--r-md, 12px); border: 1px solid var(--line);
  background: var(--surface); color: var(--text); font: inherit; cursor: pointer; text-align: center;
  transition: border-color .15s, background .15s, transform .15s var(--ease, ease);
}
.av-opcao:hover:not([aria-disabled]) { border-color: var(--line-strong); background: var(--surface-2); transform: translateY(-1px); }
.av-opcao[aria-pressed="true"] { border-color: var(--lime); box-shadow: inset 0 0 0 1px var(--lime); background: var(--surface-2); }
.av-opcao[aria-disabled] { cursor: not-allowed; }
.av-opcao[aria-disabled] .av-mini, .av-opcao[aria-disabled] .av-amostra, .av-opcao[aria-disabled] .av-pingo { opacity: 0.32; filter: grayscale(0.7); }
.av-mini { display: block; width: 64px; height: 64px; border-radius: 14px; overflow: hidden; }
.av-amostra { display: block; width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgb(255 255 255 / 0.12); }
.av-amostra-fundo { border-radius: 14px; width: 60px; height: 60px; }
.av-pingo {
  position: absolute; top: 52px; left: calc(50% + 18px); width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--surface);
}
.av-nome { font-size: 12.5px; line-height: 1.25; font-weight: 500; color: var(--text); }
.av-opcao[aria-disabled] .av-nome { color: var(--muted); }
.av-trava { display: grid; justify-items: center; gap: 4px; }
.av-trava span { font-size: 9.5px; letter-spacing: 0.04em; line-height: 1.3; text-transform: none; }
.av-cadeado {
  position: absolute; top: 8px; right: 8px; width: 16px; height: 16px; color: var(--lime);
  filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.6));
}

/* ---- conquistas */
.av-conquistas { border-top: 1px solid var(--line); padding-top: 16px; }
.av-conquistas h3 { margin: 0 0 12px; }
.av-conquistas ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.av-conquistas li { display: flex; align-items: center; gap: 12px; }
.av-conquista-icone { flex: none; width: 40px; height: 40px; border-radius: 10px; overflow: hidden; display: grid; place-items: center; background: var(--surface-2); }
.av-conquista-icone .av-amostra { width: 28px; height: 28px; }
.av-conquista-texto { min-width: 0; flex: 1; display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.av-conquista-texto strong { color: var(--text); font-weight: 600; }
.av-barra { display: block; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.av-barra > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #67c800, #c2cf00); }

/* ---- celular: prévia em cima, presa no topo */
@media (max-width: 720px) {
  .av-editor { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .av-palco {
    top: var(--av-topo, 0px); z-index: 2; grid-template-columns: auto 1fr; justify-items: start; align-items: center;
    padding: 10px 0; background: var(--bg);
  }
  .av-previa { width: 132px; border-radius: 22px; }
  .av-grade { grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
  .av-mini { width: 56px; height: 56px; }
  .av-pingo { top: 46px; }
}

/* =====================================================================
   Versão da equipe (Netlify + Supabase): perfis, ranking, retornos,
   mensagens, nota comercial, bairros. Mesmos tokens de globals.css.
   ===================================================================== */

/* ---------------------------------------------------------- nota */
.selo-nota {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 7px; margin-right: 8px;
  border-radius: 6px; font-family: var(--font-mono), monospace; font-size: 12px; vertical-align: 2px;
  border: 1px solid var(--line-strong); color: var(--muted);
}
.selo-nota b { font-weight: 700; }
.selo-nota.quente { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
.selo-nota.morna { border-color: var(--amber); color: var(--amber); }
.selo-nota.grande { height: 28px; padding: 0 10px; font-size: 13px; margin-right: 4px; }
.selo-nota.grande span { font-family: var(--font-sans); font-weight: 600; }
.nome strong .selo-nota { vertical-align: 1px; }
.status-avatar { border-radius: 50%; overflow: hidden; flex: none; }

/* ---------------------------------------------------------- ficha */
.acao-seta { width: 14px !important; height: 14px !important; margin-left: -2px; opacity: .7; }
.msg-pop { width: 440px; }
.msg-pop > .rotulo { display: block; font-size: 13px; color: var(--muted); padding: 6px 8px 10px; }
.msg-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.msg-item { display: grid; gap: 4px; width: 100%; text-align: left; padding: 10px 12px; border-radius: var(--r-sm); }
.msg-item:hover { background: var(--surface-2); }
.msg-item strong { font-size: 14px; }
.msg-item span { font-size: 13px; color: var(--muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.links-presenca { display: flex; flex-wrap: wrap; gap: 6px; margin-left: -8px; }
.links-presenca .copiar { text-decoration: none; height: 34px; border: 1px solid var(--line); padding: 0 12px; border-radius: 999px; margin-left: 8px; }
.links-presenca .copiar:hover { color: var(--text); border-color: var(--line-strong); }
.links-presenca .copiar svg { width: 15px; height: 15px; }
.dono { display: flex; align-items: center; gap: 12px; min-height: 40px; flex-wrap: wrap; }
.dono-avatar { border-radius: 50%; overflow: hidden; flex: none; }
.dono .botao { margin-left: auto; }
.botao.pequeno { height: 34px; padding: 0 14px; font-size: 14px; }
.data-livre { position: relative; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.data-livre svg { width: 16px; height: 16px; }
.data-livre input { background: none; border: 0; color: inherit; font: inherit; color-scheme: dark; width: 128px; outline: none; }
.historico { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.historico li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.historico li:last-child { border-bottom: 0; }
.historico p { margin: 3px 0 0; font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
.historico time { color: var(--muted); font-size: 12px; padding-top: 5px; white-space: nowrap; }
.hist-avatar { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; background: var(--surface-2); display: block; }

/* ---------------------------------------------------------- busca */
.salvas { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
.salvas-icone { width: 16px; height: 16px; color: var(--muted); margin-right: 2px; }
.salva { display: inline-flex; align-items: center; height: 32px; border-radius: 999px; border: 1px dashed var(--line-strong); font-size: 13px; font-weight: 600; }
.salva > button:first-child { padding: 0 4px 0 12px; height: 100%; }
.salva-x { width: 28px; height: 100%; display: grid; place-items: center; color: var(--muted); border-radius: 0 999px 999px 0; }
.salva-x:hover { color: var(--text); }
.salva-x svg { width: 14px; height: 14px; }
.salva.ativa { border-style: solid; border-color: var(--lime); color: var(--lime); }
.alternar-visao { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px; }
.alternar-visao button { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--muted); }
.alternar-visao button svg { width: 16px; height: 16px; }
.alternar-visao button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }
.bairros { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.bairro {
  position: relative; width: 100%; display: grid; grid-template-columns: 20px minmax(0, 1fr) 130px 110px 52px 80px;
  align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r-md); border: 1px solid var(--line);
  text-align: left; overflow: hidden; isolation: isolate;
}
.bairro:hover { border-color: var(--line-strong); }
.bairro-barra { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, rgb(198 248 51 / .10), rgb(198 248 51 / .03)); z-index: -1; }
.bairro > svg { width: 18px; height: 18px; color: var(--lime); }
.bairro-nome strong { display: block; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bairro-nome small { color: var(--muted); font-size: 13px; }
.bairro-num { color: var(--muted); font-size: 14px; white-space: nowrap; }
.bairro-num b { color: var(--text); font-variant-numeric: tabular-nums; }
.bairro-leads { font-size: 12px; font-weight: 700; color: var(--lime); white-space: nowrap; }

/* ---------------------------------------------------------- quem está prospectando */
.quem, .novo-perfil {
  min-height: 100dvh; display: flex; flex-direction: column;
  background: radial-gradient(70vmax 50vmax at 50% -10%, rgb(198 248 51 / .08), transparent 70%), var(--bg);
}
.quem-topo { display: flex; align-items: center; gap: 12px; padding: 24px var(--gutter); }
.quem-topo .marca-logo { height: 26px; color: var(--text); }
.quem-centro { flex: 1; display: grid; place-content: center; justify-items: center; padding: 24px var(--gutter) 12vh; text-align: center; }
.quem h1 { font-size: clamp(32px, 5vw, 56px); font-weight: 800; letter-spacing: -0.04em; margin: 0 0 clamp(28px, 5vh, 48px); line-height: 1.05; }
.quem-grade { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(16px, 3vw, 32px); max-width: 960px; }
.quem-perfil { display: grid; justify-items: center; gap: 14px; color: var(--muted); font-weight: 600; font-size: 17px; transition: color .15s; width: clamp(112px, 16vw, 160px); }
.quem-avatar { width: clamp(112px, 16vw, 160px) !important; height: clamp(112px, 16vw, 160px) !important; border-radius: 18px; overflow: hidden; outline: 3px solid transparent; outline-offset: 4px; transition: outline-color .15s, transform .2s var(--ease); }
.quem-avatar svg { width: 100%; height: 100%; display: block; }
.quem-perfil:hover, .quem-perfil:focus-visible { color: var(--text); }
.quem-perfil:hover .quem-avatar, .quem-perfil:focus-visible .quem-avatar { outline-color: var(--lime); transform: translateY(-3px); }
.quem-perfil:focus-visible { outline: none; }
.quem-mais { display: grid; place-items: center; font-size: 56px; font-weight: 300; color: var(--muted); border: 2px dashed var(--line-strong); background: transparent; }
.quem-novo:hover .quem-mais { color: var(--lime); }

.pin-veu { position: fixed; inset: 0; z-index: 80; background: rgb(0 0 0 / .78); backdrop-filter: blur(8px); display: grid; place-items: center; padding: 24px; animation: surge .18s var(--ease); }
.pin-caixa { display: grid; justify-items: center; gap: 8px; text-align: center; width: min(360px, 100%); }
.pin-caixa h2 { margin: 12px 0 0; font-size: 28px; letter-spacing: -0.03em; }
.pin-caixa p { margin: 0; }
.pin-caixa .erro, .novo-form .erro { color: var(--red); min-height: 22px; font-size: 14px; }
.pin-avatar { border-radius: 22px; overflow: hidden; }
.pin { position: relative; display: block; margin: 14px 0 4px; cursor: text; }
.pin input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; font-size: 16px; }
.pin-caixas { display: flex; gap: 12px; }
.pin-caixas i { width: 54px; height: 64px; border-radius: 14px; border: 2px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; transition: border-color .15s; }
.pin-caixas i.cheia::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--lime); }
.pin input:focus + .pin-caixas i.atual { border-color: var(--lime); }
.pin.tremer { animation: tremer .35s; }
@keyframes tremer { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

.novo-centro { flex: 1; width: min(1080px, 100%); margin: 0 auto; padding: 8px var(--gutter) 64px; }
.passo { color: var(--muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.novo-form h1 { font-size: clamp(30px, 4.4vw, 48px); font-weight: 800; letter-spacing: -0.04em; margin: 10px 0 6px; line-height: 1.05; }
.novo-form > p.muted { margin: 0 0 24px; max-width: 56ch; }
.novo-form.estreito { max-width: 400px; margin: 4vh auto 0; display: grid; justify-items: start; }
.novo-form.estreito .pin-avatar { margin-bottom: 8px; }
.novo-form .rotulo { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
.novo-nome { display: block; max-width: 420px; margin-bottom: 20px; }
.novo-acoes, .perfil-acoes { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 28px; width: 100%; }
.perfil-acoes { justify-content: flex-start; }

/* ---------------------------------------------------------- topo da equipe */
.nav-equipe a { position: relative; }
.nav-equipe a svg { width: 18px; height: 18px; }
.nav .contador.alerta { background: var(--amber); }
.eu-botao { display: inline-flex; align-items: center; gap: 10px; margin-left: 12px; padding: 3px 3px 3px 12px; border-radius: 999px; border: 1px solid var(--line); }
.eu-botao:hover, .eu-botao[data-state="open"] { border-color: var(--line-strong); }
.eu-pontos { font-size: 12px; color: var(--lime); white-space: nowrap; }
.eu-avatar { border-radius: 50%; overflow: hidden; display: block; flex: none; }
.eu-menu { min-width: 260px; }
.eu-cabeca { display: flex; align-items: center; gap: 12px; padding: 8px 8px 14px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
.eu-cabeca strong { display: block; }
.eu-cabeca small { font-size: 13px; }
.eu-menu .opcao { display: flex; align-items: center; gap: 10px; width: 100%; text-decoration: none; color: var(--text); }
.eu-menu .opcao svg { width: 18px; height: 18px; color: var(--muted); }
.topo { gap: 12px; }
.topo .nav { margin-left: auto; }

.conquista {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 75;
  display: flex; align-items: center; gap: 16px; padding: 14px 16px; width: min(520px, calc(100vw - 32px));
  background: var(--surface); border: 1px solid var(--lime); border-radius: 18px;
  box-shadow: 0 24px 60px rgb(0 0 0 / .6), 0 0 0 6px rgb(198 248 51 / .08); animation: subir .4s var(--ease);
}
.conquista > div:nth-child(2) { flex: 1; min-width: 0; display: grid; }
.conquista strong { font-size: 18px; letter-spacing: -0.02em; }
.conquista small { font-size: 13px; }
.conquista-rotulo { font-size: 11px; color: var(--lime); letter-spacing: .16em; text-transform: uppercase; }
.conquista-acoes { display: flex; gap: 4px; }
@keyframes subir { from { opacity: 0; transform: translate(-50%, 24px) scale(.96); } }

/* ---------------------------------------------------------- ranking */
.podio { list-style: none; margin: 40px auto 0; padding: 0; display: flex; justify-content: center; gap: 16px; align-items: flex-end; max-width: 760px; }
.podio > * { flex: 0 1 240px; min-width: 0; }
.podio-lugar { position: relative; display: grid; justify-items: center; gap: 8px; text-align: center; }
.podio-avatar { border-radius: 24px; overflow: hidden; }
.podio-lugar.p1 .podio-avatar { outline: 3px solid var(--lime); outline-offset: 4px; }
.podio-lugar.eu strong::after { content: " (você)"; color: var(--muted); font-weight: 500; }
.podio-lugar strong { font-size: 17px; margin-top: 6px; }
.podio-pts { color: var(--muted); font-size: 14px; }
.podio-pts b { color: var(--text); font-size: 20px; font-variant-numeric: tabular-nums; }
.podio-coroa { position: absolute; top: -30px; width: 30px; height: 30px; color: var(--lime); fill: rgb(198 248 51 / .25); }
.podio-base { width: 100%; display: grid; place-items: center; border-radius: 14px 14px 0 0; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; color: var(--muted); font-size: 20px; font-weight: 700; margin-top: 8px; }
.podio-lugar.p1 .podio-base { height: 110px; background: linear-gradient(180deg, rgb(198 248 51 / .16), var(--surface)); color: var(--lime); border-color: rgb(198 248 51 / .35); }
.podio-lugar.p2 .podio-base { height: 80px; }
.podio-lugar.p3 .podio-base { height: 56px; }
.tabela-rolagem { overflow-x: auto; margin-top: 0; border-top: 1px solid var(--line); }
.ranking { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 560px; }
.ranking th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 500; padding: 14px 12px; border-bottom: 1px solid var(--line); }
.ranking td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.ranking tr.eu td { background: rgb(198 248 51 / .06); }
.ranking-pessoa { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; }
.ranking-rodape { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 32px; }
.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px 20px; }
.cartao h3 { margin: 0 0 12px; font-size: 15px; }
.regras { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14px; color: var(--muted); }
.regras b { display: inline-block; min-width: 34px; color: var(--lime); font-family: var(--font-mono), monospace; }
.metas { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.metas li { display: grid; grid-template-columns: minmax(0, 1fr) 90px 56px; align-items: center; gap: 12px; }
.metas li div { display: grid; }
.metas small { font-size: 12px; }
.meta-barra { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.meta-barra i { display: block; height: 100%; background: linear-gradient(90deg, #67c800, #c2cf00); border-radius: inherit; }
.meta-num { font-size: 12px; color: var(--muted); text-align: right; }

/* ---------------------------------------------------------- retornos, perfil, mensagens */
.retorno-bloco { margin-top: 28px; }
.retorno-bloco h2 { font-size: 18px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; }
.retorno-bloco h2 .qtd { color: var(--muted); font-weight: 500; }
.retorno-bloco.alerta h2 { color: var(--amber); }
.retorno-bloco.hoje h2 { color: var(--lime); }
.perfil-resumo { display: flex; flex-wrap: wrap; gap: 8px; margin: -8px 0 24px; }
.perfil-resumo span { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.perfil-resumo b { color: var(--text); font-variant-numeric: tabular-nums; }
.trocar-pin { max-width: 420px; margin-top: 32px; }
.modelos { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
.modelos p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
.modelo-cabeca { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.modelo-cabeca span { display: flex; }
.modelo-form { display: grid; gap: 14px; max-width: 720px; margin-bottom: 8px; }
.modelo-form .rotulo { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
.variaveis { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }
.variaveis button { font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line-strong); color: var(--muted); }
.variaveis button:hover { color: var(--lime); border-color: var(--lime); }
.previa { background: var(--surface-2); border-radius: var(--r-sm); padding: 12px 14px; }
.previa p { margin: 0; font-size: 14px; line-height: 1.5; }
.previa .rotulo { margin-bottom: 4px; }

/* ---------------------------------------------------------- telas pequenas */
@media (max-width: 900px) {
  .bairro { grid-template-columns: 20px minmax(0, 1fr) auto 52px; }
  .bairro-num:nth-of-type(2), .bairro-leads { display: none; }
}
@media (max-width: 820px) {
  .nav-nome { display: none; }
  .nav-equipe a { padding: 0 10px; }
  .eu-pontos { display: none; }
  .eu-botao { padding: 3px; margin-left: 4px; }
  .topo .marca-produto { display: none; }
}
@media (max-width: 560px) {
  .bairro { grid-template-columns: minmax(0, 1fr) auto 44px; padding: 12px; gap: 10px; }
  .bairro > svg { display: none; }
  .podio { gap: 8px; }
  .podio-lugar strong { font-size: 14px; }
  .metas li { grid-template-columns: minmax(0, 1fr) 56px; }
  .meta-barra { grid-column: 1 / -1; grid-row: 2; }
  .conquista { flex-wrap: wrap; }
  .conquista-acoes { width: 100%; justify-content: flex-end; }
  .pin-caixas i { width: 50px; height: 58px; }
  .barra-acoes { flex-wrap: wrap; }
}
.pagina { --av-topo: var(--header-h); }

/* ---- ajustes da demonstração (frame do artifact) ---- */
:root { color-scheme: dark; background: var(--bg); }
html { padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
body { background: var(--bg); color: var(--text); }
.topo { top: env(safe-area-inset-top, 0px); padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
.pagina { padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
.massa { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.faixa-demo { display: flex; gap: 6px 16px; flex-wrap: wrap; align-items: center; justify-content: center; min-height: 36px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface-2); color: var(--muted); font-size: 13px; text-align: center; border-bottom: 1px solid var(--line); }
.faixa-demo strong { color: var(--text); font-weight: 600; }
#aviso-demo { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--text); color: var(--bg); font-weight: 600; padding: 12px 18px; border-radius: 999px; max-width: calc(100vw - 32px); text-align: center; box-shadow: 0 16px 40px rgb(0 0 0 / .5); }
</style>
