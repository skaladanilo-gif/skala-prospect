<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<title>Proposta · Skala</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a; --surface: #141414; --surface-2: #1a1a1a; --line: #262626; --line-strong: #333;
  --text: #ededed; --muted: #8a8a8a; --lime: #c6f833; --lime-ink: #0a0a0a;
  --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Space Mono", ui-monospace, Menlo, monospace;
  --gutter: clamp(20px, 5vw, 56px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { overflow-x: clip; margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.pagina { max-width: 1040px; margin: 0 auto; padding: 0 var(--gutter) 120px; }
.topo { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 28px 0 0; }
.logo { height: 26px; width: auto; display: block; color: var(--text); }
.mono { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.botao { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 24px; border-radius: 999px; font: 700 16px var(--sans); text-decoration: none; border: 0; cursor: pointer; transition: transform .15s, background .15s; }
.botao:active { transform: scale(.98); }
.botao.primario { background: var(--lime); color: var(--lime-ink); }
.botao.primario:hover { background: #d4ff52; }
.botao.secundario { background: transparent; color: var(--text); border: 1px solid var(--line-strong); }
.botao.secundario:hover { border-color: var(--muted); }
.botao.pequeno { height: 40px; padding: 0 16px; font-size: 14px; }
.botao svg { width: 20px; height: 20px; flex: none; }

/* hero */
.hero { position: relative; padding: clamp(56px, 12vh, 120px) 0 clamp(40px, 8vh, 80px); border-bottom: 1px solid var(--line); }
.hero::before { content: ""; position: absolute; inset: -40px calc(var(--gutter) * -1) auto; height: 520px; background: radial-gradient(50% 60% at 30% 10%, rgb(198 248 51 / .10), transparent 70%); pointer-events: none; z-index: -1; }
.hero .mono { color: var(--lime); }
.hero h1 { overflow-wrap: anywhere; margin: 18px 0 0; font-size: clamp(42px, 8.4vw, 96px); line-height: .98; letter-spacing: -0.05em; font-weight: 800; text-wrap: balance; }
.hero h1 span { color: var(--muted); font-weight: 700; display: block; font-size: .5em; letter-spacing: -0.03em; margin-bottom: 8px; }
.hero p { margin: 22px 0 0; max-width: 52ch; color: var(--muted); font-size: clamp(17px, 2vw, 20px); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
.chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 14px; font-weight: 500; }
.chip b { font-weight: 700; }

/* seções */
section.bloco { padding: clamp(48px, 9vh, 88px) 0; border-bottom: 1px solid var(--line); }
.cabeca { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 8px 40px; align-items: baseline; }
.cabeca .num { font-family: var(--mono); color: var(--lime); font-size: 13px; letter-spacing: .14em; }
.cabeca h2 { margin: 0; font-size: clamp(30px, 4.6vw, 52px); line-height: 1.02; letter-spacing: -0.04em; font-weight: 800; text-wrap: balance; }
.corpo { margin-left: 220px; margin-top: 28px; }
.vimos { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.vimos li { position: relative; padding: 20px 22px 20px 58px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; font-size: 18px; line-height: 1.45; }
.vimos li::before { content: ""; position: absolute; left: 22px; top: 25px; width: 18px; height: 18px; background: var(--lime);
  clip-path: path("M17.6 8.1c.5.1.5.9 0 1l-3 .9a4.2 4.2 0 0 0-2.8 2.8l-.9 3c-.1.5-.9.5-1 0l-.9-3a4.2 4.2 0 0 0-2.8-2.8l-3-.9c-.5-.1-.5-.9 0-1l3-.9a4.2 4.2 0 0 0 2.8-2.8l.9-3c.1-.5.9-.5 1 0l.9 3a4.2 4.2 0 0 0 2.8 2.8z"); }

/* dinheiro na mesa */
.dinheiro { margin-left: 220px; margin-top: 28px; padding: clamp(24px, 4vw, 40px); border-radius: 28px; border: 1px solid rgb(198 248 51 / .35);
  background: radial-gradient(90% 120% at 0% 0%, rgb(198 248 51 / .12), transparent 60%), var(--surface); }
.valor { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; }
.valor strong { font-size: clamp(48px, 11vw, 120px); overflow-wrap: anywhere; line-height: .95; letter-spacing: -0.055em; font-weight: 800; font-variant-numeric: tabular-nums; }
.valor span { color: var(--muted); font-size: 20px; font-weight: 600; }
.estimativa { display: inline-block; margin-bottom: 14px; padding: 5px 10px; border-radius: 999px; background: rgb(198 248 51 / .14); color: var(--lime); font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.frase-valor { margin: 14px 0 0; font-size: 19px; max-width: 46ch; }
.contas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 28px; }
.conta { padding: 16px; border-radius: 16px; background: rgb(255 255 255 / .04); border: 1px solid var(--line); }
.conta b { display: block; font-size: 24px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.conta span { display: block; color: var(--muted); font-size: 14px; line-height: 1.35; margin-top: 4px; }
.conta-op { font-family: var(--mono); color: var(--lime); font-size: 12px; }
.aviso-est { margin: 18px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 70ch; }

/* pilares */
.pilares { margin-left: 220px; margin-top: 28px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pilar { padding: 24px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.pilar .mono { color: var(--lime); }
.pilar h3 { margin: 0; font-size: 22px; letter-spacing: -0.03em; line-height: 1.15; }
.pilar p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.5; }
.oferta { margin: 18px 0 0 220px; padding: 22px 24px; border-left: 3px solid var(--lime); background: rgb(198 248 51 / .05); border-radius: 0 18px 18px 0; font-size: 19px; line-height: 1.5; white-space: pre-wrap; }

/* próximo passo */
.final { padding: clamp(56px, 10vh, 104px) 0 40px; text-align: center; }
.final h2 { margin: 0 auto; max-width: 18ch; font-size: clamp(36px, 6.4vw, 72px); line-height: 1; letter-spacing: -0.05em; font-weight: 800; text-wrap: balance; }
.final p { margin: 18px auto 0; max-width: 46ch; color: var(--muted); font-size: 18px; }
.vendedor { display: inline-flex; align-items: center; gap: 14px; margin: 34px auto 0; padding: 10px 22px 10px 10px; border-radius: 999px; border: 1px solid var(--line-strong); text-align: left; }
.iniciais { width: 52px; height: 52px; border-radius: 50%; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; font-weight: 800; font-size: 18px; letter-spacing: -0.02em; flex: none; }
.vendedor strong { display: block; font-size: 17px; }
.vendedor small { color: var(--muted); font-size: 14px; }
.acoes-final { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 24px; }
.rodape { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; padding: 28px 0 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.rodape a { text-decoration: none; }
.rodape a:hover { color: var(--text); }
.assinatura { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }

/* barra flutuante (só no celular): o único vidro da página */
.barra { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 10; display: none; align-items: center; gap: 12px; padding: 8px 8px 8px 18px; border-radius: 999px;
  background: linear-gradient(180deg, rgb(255 255 255 / .10), rgb(255 255 255 / .02)), rgb(30 30 32 / .5);
  -webkit-backdrop-filter: blur(22px) saturate(190%); backdrop-filter: blur(22px) saturate(190%);
  border: 1px solid rgb(255 255 255 / .16);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .3), 0 10px 36px rgb(0 0 0 / .45);
  transform: translateY(140%); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.barra.visivel { transform: none; }
.barra span { flex: 1; font-size: 14px; font-weight: 600; line-height: 1.25; min-width: 0; }
.barra span small { display: block; color: var(--muted); font-weight: 500; }
.barra .botao { height: 46px; padding: 0 18px; font-size: 15px; }

/* estados */
.estado { min-height: 80vh; display: grid; place-content: center; justify-items: center; text-align: center; gap: 14px; padding: 40px var(--gutter); }
.estado h1 { margin: 0; font-size: clamp(30px, 5vw, 44px); letter-spacing: -0.04em; max-width: 20ch; }
.estado p { margin: 0; color: var(--muted); max-width: 44ch; }
.giro { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line-strong); border-top-color: var(--lime); animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.esqueleto { width: min(680px, 90vw); display: grid; gap: 14px; }
.esqueleto i { display: block; height: 18px; border-radius: 8px; background: linear-gradient(90deg, #161616, #222, #161616); background-size: 200% 100%; animation: brilho 1.4s infinite; }
.esqueleto i:first-child { height: 64px; }
@keyframes brilho { to { background-position: -200% 0; } }
.aparecer { animation: subir .6s cubic-bezier(.2,.8,.2,1) both; }
@keyframes subir { from { opacity: 0; transform: translateY(14px); } }

@media (max-width: 820px) {
  .cabeca { grid-template-columns: 1fr; }
  .corpo, .dinheiro, .pilares, .oferta { margin-left: 0; }
  .contas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pilares { grid-template-columns: 1fr; }
  .barra { display: flex; }
  .topo .botao { display: none; }
  .vimos li { font-size: 16px; padding: 16px 16px 16px 48px; }
  .vimos li::before { left: 16px; top: 20px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* impressão / PDF: versão clara */
@media print {
  @page { margin: 14mm; }
  :root { --bg: #fff; --surface: #f6f6f3; --line: #e2e2dc; --line-strong: #cfcfc8; --text: #111; --muted: #555; --lime: #4f7a00; --lime-ink: #fff; color-scheme: light; }
  body { font-size: 12.5pt; }
  .barra, .nao-imprimir, .hero::before { display: none !important; }
  .pagina { padding-bottom: 0; }
  .dinheiro { background: #f6f6f3; border-color: #cfe3a0; }
  .vimos li::before { background: #4f7a00; }
  section.bloco, .pilar, .dinheiro, .vimos li { break-inside: avoid; }
  .iniciais { background: #c6f833; color: #0a0a0a; }
  a[href]::after { content: ""; }
}
</style>
</head>

<div id="app" aria-live="polite">
  <div class="estado"><div class="esqueleto" aria-hidden="true"><i></i><i></i><i style="width:70%"></i></div><p>Carregando a proposta…</p></div>
</div>
<script>
(() => {
  const FUNCAO = "https://syjijqhttqznqzzmruwc.supabase.co/functions/v1/proposta";
  const VALIDADE_DIAS = 90;
  const LOGO = '<svg class="logo" viewBox="0 0 292 80" role="img" aria-label="Skala"><defs><linearGradient id="lg" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#c2cf00"/><stop offset="1" stop-color="#67c800"/></linearGradient></defs><path fill="currentColor" d="M 179.52 48.38 C 179.52 42.27 180.61 36.93 182.79 32.36 C 185.03 27.79 188.05 24.28 191.85 21.82 C 195.71 19.36 200 18.13 204.71 18.13 C 208.79 18.13 212.3 18.94 215.25 20.55 C 218.2 22.17 220.48 24.35 222.1 27.09 L 222.1 18.87 L 242.76 18.87 L 242.76 78 L 222.1 78 L 222.1 69.78 C 220.48 72.52 218.16 74.7 215.14 76.31 C 212.19 77.93 208.71 78.74 204.71 78.74 C 200 78.74 195.71 77.51 191.85 75.05 C 188.05 72.59 185.03 69.07 182.79 64.51 C 180.61 59.87 179.52 54.49 179.52 48.38 Z M 222.1 48.38 C 222.1 44.59 221.05 41.6 218.94 39.42 C 216.9 37.24 214.37 36.15 211.35 36.15 C 208.26 36.15 205.69 37.24 203.65 39.42 C 201.62 41.53 200.6 44.52 200.6 48.38 C 200.6 52.18 201.62 55.2 203.65 57.45 C 205.69 59.62 208.26 60.71 211.35 60.71 C 214.37 60.71 216.9 59.62 218.94 57.45 C 221.05 55.27 222.1 52.25 222.1 48.38 Z M 222.1 48.38 M 175.73 0 L 175.73 78 L 157.71 78 L 157.71 0 Z M 175.73 0 M 91.64 48.59 C 91.64 42.69 92.8 37.45 95.12 32.89 C 97.51 28.32 100.71 24.8 104.71 22.35 C 108.79 19.89 113.32 18.66 118.31 18.66 C 122.67 18.66 126.46 19.54 129.7 21.29 C 133 23.05 135.63 25.26 137.6 27.93 L 137.6 19.61 L 152.46 19.61 L 152.46 78 L 137.6 78 L 137.6 69.46 C 135.7 72.2 133.07 74.48 129.7 76.31 C 126.39 78.07 122.56 78.95 118.21 78.95 C 113.29 78.95 108.79 77.68 104.71 75.15 C 100.71 72.62 97.51 69.07 95.12 64.51 C 92.8 59.87 91.64 54.56 91.64 48.59 Z M 137.6 48.8 C 137.6 45.22 136.9 42.16 135.49 39.63 C 134.09 37.03 132.19 35.07 129.8 33.73 C 127.41 32.32 124.85 31.62 122.11 31.62 C 119.37 31.62 116.84 32.29 114.52 33.62 C 112.2 34.96 110.3 36.93 108.82 39.53 C 107.42 42.05 106.72 45.08 106.72 48.59 C 106.72 52.11 107.42 55.2 108.82 57.87 C 110.3 60.47 112.2 62.47 114.52 63.88 C 116.91 65.28 119.44 65.98 122   const ZAP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.7-.4Z"/></svg>';
  const PDF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>';

  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (n) => Math.round(Number(n) || 0).toLocaleString("pt-BR");
  const pct = (n) => `${(Number(n) * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 })}%`;
  const reais = (n) => "R$ " + num(n);
  const iniciais = (nome) => String(nome || "S").trim().split(/\s+/).slice(0, 2).map((p) => p[0]).join("").toUpperCase();
  const zap = (numero, texto) => numero ? `https://wa.me/55${String(numero).replace(/\D/g, "").replace(/^55(?=\d{10,11}$)/, "")}?text=${encodeURIComponent(texto)}` : null;

  function estado(titulo, texto, extra = "") {
    app.innerHTML = `<main class="estado aparecer">${LOGO}<h1>${esc(titulo)}</h1><p>${esc(texto)}</p>${extra}</main>`;
  }

  const id = new URLSearchParams(location.search).get("id") || "";
  const previa = new URLSearchParams(location.search).get("previa") === "1";
  if (!/^[0-9a-f-]{36}$/i.test(id)) { estado("Proposta não encontrada", "O link parece incompleto. Peça para quem te enviou mandar de novo."); return; }

  fetch(`${FUNCAO}?id=${encodeURIComponent(id)}${previa ? "&previa=1" : ""}`)
    .then((r) => (r.status === 404 ? null : r.ok ? r.json() : Promise.reject()))
    .then((d) => {
      if (!d) return estado("Proposta não encontrada", "Ela pode ter sido apagada. Peça para quem te enviou mandar um link novo.");

      const x = d.dados || {};

    const nome = e.nome || "sua empresa";
    document.title = `Proposta para ${nome} · Skala`;
    const local = [e.bairro, e.cidade].filter(Boolean).join(", ");
    const data = new Date(criado).toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric" });
    const clientes = (est.buscas || 0) * (est.captura || 0) * (est.conversao || 0);
    const textoZap = `Oi ${v.nome || ""}, vi a proposta da Skala para a ${nome} e quero conversar.`;
